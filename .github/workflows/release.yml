# Publish the fixture directories as release tarballs on every push to main
# and to stable release branches (vX.Y).
#
# Each push creates a GitHub release tagged with the first 8 characters of the
# commit SHA, so a consumer that pins a test-vectors commit can download
# fixtures directly, whichever branch the commit is on:
#
#   https://github.com/firedancer-io/test-vectors/releases/download/<sha[0:8]>/<dir>.tar.gz
#
# Releases from a stable branch are titled "[vX.Y] <subject>" and are never
# marked as the latest release; that is reserved for the head of main.
#
# Archives are built by scripts/package.sh. The release notes carry the
# SHA-256 of every archive, and a SHA256SUMS asset is attached alongside them.

name: release

on:
  push:
    branches: [main, 'v[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    name: publish fixture tarballs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Check for existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_SHA::8}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package fixtures
        if: steps.existing.outputs.exists == 'false'
        run: |
          ./scripts/package.sh > notes.md
          (cd out && sha256sum -- *.tar.gz > SHA256SUMS)
          cat notes.md
          du -h out/*

      - name: Publish release
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          tag="${GITHUB_SHA::8}"
          subject="${HEAD_COMMIT_MESSAGE%%$'\n'*}"
          title="${subject:-$tag}"
          latest=false
          if [[ $GITHUB_REF_NAME == main ]]; then
            # Runs are not serialized, so only claim "latest" if no newer
            # commit has landed on main while this one was packaging.
            head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
            [[ $head == "$GITHUB_SHA" ]] && latest=true
          else
            title="[$GITHUB_REF_NAME] $title"
          fi
          gh release create "$tag" out/*.tar.gz out/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "$title" \
            --notes-file notes.md \
            --latest="$latest"
